package:
  path: {{ path }}
  # To publish an outer bundle archive, replace path with:
  # archive_path: ./approved-packages.zip
  format: {{ format }}
  publish_driver: {{ driver }}
  recursive: true
  # Paths are relative to package.path (or the extracted archive root).
  # exclude:
  #   - quarantine
  #   - cache/legacy

repository_profile: {{ profile }}

repositories:
  internal-npm:
    provider: {{ provider }}
    organization: {{ org }}
    project: {{ project }}
    feed: {{ repository }}
    # Optional organization-level endpoint overrides. Azure defaults are used when omitted.
    # feed_base_url: https://feeds.example.com/{{ org }}
    # package_base_url: https://packages.example.com/{{ org }}
    credential_ref: {{ credential }}

  # Nexus profile example (use a format-compatible hosted repository):
  # nexus-hosted:
  #   provider: nexus
  #   base_url: https://nexus.example.com
  #   repository: maven-hosted
  #   username: publisher
  #   credential_ref: NEXUS_PASSWORD

options:
  existing_package_policy: SKIP_IDENTICAL
  timeout: 5m
  retry_count: 2
  dry_run: false
  parallelism: 10
  fail_fast: false

metadata:
  pipeline_id: ""
  build_id: ""
  commit_sha: ""
  correlation_id: ""
